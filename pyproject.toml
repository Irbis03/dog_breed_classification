[build-system]
requires = ["uv-build>=0.4.0"]
build-backend = "uv_build"

[project]
name = "dog-breed"
version = "0.1.0"
description = "Dog Breed Identification Pipeline"
authors = [{email = "ralovets.iaa@phystech.edu"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.17.0",
    "pytorch-lightning>=2.0.0",
    "hydra-core>=1.3.2",
    "mlflow>=2.10.0",
    "dvc>=3.40.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "albumentations>=1.3.1",
    "opencv-python>=4.8.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]


[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pre-commit>=3.6.0",
    "ruff>=0.2.0",
]

[tool.uv.build-backend]
source-dir = "src"

[project.scripts]
dog-train = "dog_breed.train:main"
dog-infer = "dog_breed.infer:main"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
